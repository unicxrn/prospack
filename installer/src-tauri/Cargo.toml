[package]
name = "prospack-setup"
version = "0.1.0"
description = "Prospack Setup for Windows"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
mslnk = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
